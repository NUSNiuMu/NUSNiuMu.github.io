    <section class="case-section">
      <h2>对照实验</h2>
      <p>把 LIO-SAM、FAST-LIO、Point-LIO 和 FASTER-LIO 接入同一套 ROS 导航接口。每次只换 SLAM 后端，机器人、地图、规划参数和航点路线保持一致。</p>
      <p>离线回放比较轨迹误差和资源开销，实机运行观察局部代价地图、避障和航点到达。</p>
