      <h1 lang="en">Insight Capture Dashboard</h1>
      <p>三设备同步采集。Jetson 跑采集后端，手机负责现场控制，Qt 负责桌面回放和质检。</p>
      <ul class="case-links">
        <li><a href="https://github.com/NUSNiuMu/insight-capture-dashboard">GitHub 仓库</a></li>

    <section class="case-section">
      <h2>现场采集</h2>
      <p>手机端用 WebRTC 同时预览三路画面，可以在线校准和开停录制。分布式录制时，各设备先保存自己的数据，再按需回传与合包。</p>
    </section>
    <section class="case-section">
      <h2>回放与质检</h2>
      <p>Qt 桌面端管理任务，查找、回放、评分和优化录制。建图定位、录制和后处理由 Jetson 后端负责，两端共用项目状态。</p>
    </section>
